name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build PDFManager.sln --configuration Release

      - name: Test
        run: dotnet test PDFManager.sln --configuration Release --no-build
