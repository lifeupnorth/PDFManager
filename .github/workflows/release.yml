name: release

# Push a tag like v1.0.0 (matching <Version> in Directory.Build.props) to build the
# installers and publish them as a GitHub release. Run it manually to just build them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml] $props = Get-Content Directory.Build.props
          $version = @($props.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME doesn't match version $version in Directory.Build.props."
          }

      - name: Test
        run: dotnet test PDFManager.sln --configuration Release

      - name: Build installers
        shell: pwsh
        run: ./installer/build.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: installers
          path: artifacts/installers/*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem artifacts/installers/*.exe).FullName
          # The installers section from release-notes.md, then GitHub's generated changelog
          $notes = (Get-Content .github/release-notes.md -Raw -Encoding utf8).Replace('{version}', $env:GITHUB_REF_NAME.TrimStart('v'))
          gh release create $env:GITHUB_REF_NAME @files --title "PDF Manager $env:GITHUB_REF_NAME" --notes $notes --generate-notes
